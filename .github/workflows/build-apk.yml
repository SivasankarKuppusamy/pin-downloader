
name: Build PinVideo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        shell: bash
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml \
              "$RUNNER_TEMP/PinVideoManifest.xml"
          fi

          rm -rf android
          flutter create --platforms=android \
            --org com.example \
            --project-name pinvideo .

          if [ -f "$RUNNER_TEMP/PinVideoManifest.xml" ]; then
            cp "$RUNNER_TEMP/PinVideoManifest.xml" \
              android/app/src/main/AndroidManifest.xml
          fi

      
      - name: Install Android SDK 37
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platforms;android-37" \
            "build-tools;36.0.0" \
            "platform-tools"



      - name: Set compile SDK to 37
        shell: bash
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/' \
            android/app/build.gradle.kts


      - name: Get Flutter packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pinvideo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
