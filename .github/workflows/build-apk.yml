name: Build PinVideo APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android project files
        shell: bash
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/pinvideo-AndroidManifest.xml
          flutter create . --platforms=android --org com.pinvideo
          cp /tmp/pinvideo-AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Format Dart source
        run: dart format lib/main.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinvideo-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
