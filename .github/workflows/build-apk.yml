name: Build PinVideo APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # This starter ZIP intentionally keeps the repo small. Generate the standard
      # Android Gradle project on the runner, preserving the app's manifest.
      - name: Generate Android project files
        shell: bash
        run: |
          cp android/app/src/main/AndroidManifest.xml "$RUNNER_TEMP/PinVideoManifest.xml"
          rm -rf android
          flutter create --platforms=android --org com.example --project-name pinvideo .
          cp "$RUNNER_TEMP/PinVideoManifest.xml" android/app/src/main/AndroidManifest.xml

      - name: Install Android SDK 37
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0"

      - name: Set compile SDK to 37
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/' android/app/build.gradle.kts
            sed -i 's/compileSdk = 36/compileSdk = 37/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 37/' android/app/build.gradle
            sed -i 's/compileSdk 36/compileSdk 37/' android/app/build.gradle
          fi

      - name: Get Flutter packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pinvideo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
